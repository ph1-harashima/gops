# CRITICAL SAFETY GATE (implementation instructions 0.3 Profile Guard):
# This application NEVER starts without an explicitly active Spring profile.
# No "spring.profiles.active" default is set here on purpose - the operator
# must pass one of local/demo/test explicitly, e.g.:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#   SPRING_PROFILES_ACTIVE=local java -jar gsys-portal-backend.jar
# Any other profile (or none at all) is rejected by
# com.glv.gsysportal.safety.SafetyGuardEnvironmentPostProcessor before any
# DataSource bean is created. See that class for the full Safety Gate.
spring:
  application:
    name: gsys-portal-backend
  # Default DataSource autoconfiguration is disabled - two explicit DataSources
  # (legacy READ ONLY, prototype READ/WRITE) are configured by hand in
  # com.glv.gsysportal.config.LegacyDataSourceConfig / PrototypeDataSourceConfig.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      # Flyway is wired explicitly and exclusively to prototypeDataSource in
      # com.glv.gsysportal.config.PrototypeFlywayConfig - autoconfiguration is
      # excluded so there is no implicit dual-DataSource ambiguity (Step 2 2章).
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

# Legacy G-SYS Adapter datasource.
# In this Step this points at the disposable Legacy Demo Instance started via
# docker-compose.yml (legacy-demo-mysql), NOT the real/shared Legacy G-SYS database.
# See docs/G-SYS_Online-Ordering_Prototype_Technical_Design.md 6.2 and the
# Legacy Demo Instance decision recorded for this implementation session.
app:
  legacy:
    datasource:
      jdbc-url: jdbc:mysql://localhost:33061/legacy_demo?useSSL=false&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true
      username: gsys_portal_ro
      password: gsys_portal_ro_demo_pw
      driver-class-name: com.mysql.cj.jdbc.Driver
      # SELECT-only pool: read-only enforced at DB-user level (see demo-data/03-readonly-user.sql)
      # AND at connection-pool level (Layer 2/3 of the READ ONLY guarantee).
      read-only: true
      maximum-pool-size: 5
  prototype:
    datasource:
      jdbc-url: jdbc:postgresql://localhost:54321/gsys_portal
      username: gsys_portal
      password: gsys_portal_demo_pw
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 5

server:
  port: 8080

# Phase 8-L (Production Reliability Foundation, Production Readiness Audit
# §2-4): only /actuator/health is exposed - no /actuator/env, /actuator/beans,
# /actuator/metrics etc. show-details=never means the body is always the bare
# {"status":"UP"|"DOWN"} aggregate, for anyone, authenticated or not - no DB
# component breakdown, no exception detail, ever (§4's explicit "no Secret/
# JDBC URL/stack trace" requirement; a Role-gated detailed view would require
# a Production Authentication Rule this Phase does not decide, §4). Legacy DB
# is deliberately excluded from this aggregate (see health/PortalDatabaseHealthIndicator's
# Javadoc) - management.health.db.enabled=false turns off Spring Boot's own
# automatic multi-DataSource indicator (which would otherwise ambiguously
# register both DataSources) so PortalDatabaseHealthIndicator is the only
# DB contributor here.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false

logging:
  level:
    com.glv.gsysportal: INFO
  # Phase 8-L: correlationId is populated into MDC per-request by
  # CorrelationIdFilter - reusing Spring Boot's existing default Logback
  # setup via this supported property, not a new logging product.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"
